<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--unordered list-->
    <ul>
        <li>dharani</li>
        <li>gayathri</li>
        <li>bhargavi</li>
    </ul>
    <!--ordered list-->
    <ol>
        <li>dharani</li>
        <li>gayathri</li>
        <li>bhargavi</li>
    </ol>
    <dl style="background-color: pink; border: 2px solid;" >
    <!--description list-->
    <dt>Dharani</dt>
    <dd>my name is dharani</dd>
    <dt>gayathri</dt>
    <dd>my name is gaythri</dd>
    </dl>
</body>
</html>
