<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="frames.php" method="post">
        <div>
        <label for="username">username:</label>
        <input type="text" id="username" placeholder="abcdef" minlength="6" maxlength="15" required>
        </div><br>
        <div>
        <label for="password">password:</label>
        <input type="password" id="password" placeholder="abcdef" minlength="6" maxlength="15" required>
        </div><br>
        <div>
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="abcdef@gmail.com" minlength="6" maxlength="25" required>
        </div><br>
        <div>
        <label for="number">pho.no:</label>
        <input type="number" id="number" placeholder="1234567890" minlength="10" maxlength="10" pattern="{0-9}{10}" required>
        </div><br>
        <div>
        <label for="bday">birthda:</label>
        <input type="date" id="bday">
        </div><br>
        <div>
        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" min="0" max="100" value="1">
        </div><br>
        <div>
        <label for="gender">gender</label>
        <label for="male">male</label>
        <input type="radio" id="male" value="male" name="title">
        <label for="female">female</label>
        <input type="radio" id="female" value="female" name="title">
        <label for="others">others</label>
        <input type="radio" id="others" value="others" name="title">
        </div><br>
        <div>
        <label for="payment">payment:</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="pp">phonepe</option>
            <option value="ptm">paytm</option>
        </select>
        </div><br>
        <div>
        <label for="subscribe">subscribe:</label>
        <input type="checkbox" id="subscribe" required>
        </div><br>
        <div>
        <label for="comment">comment:</label>
        <textarea id="comment" rows="6" cols="30"></textarea>
        </div><br>
        <div>
        <label for="file">resume;</label>
        <input type="file" id="file" accept="image/png, .py">
        </div><br>
        <div>
        <input type="submit">
        </div><br>
        <div>
        <input type="reset">
        </div><br>
    </form>
</body>
</html>
